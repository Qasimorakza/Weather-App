<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet"
     href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
     <div class="main-container">
      
         <!-- search-container -->
         <div class="search-container">
            <input id="inputElement"  type="text" spellcheck="false" placeholder="search your city">
            <button id="searchButton">
                <i class="fa fa-search" aria-hidden="true"></i>
            </button>
         </div>

         <!-- weather conditions -->
          <div class="weathe-condition">
            <img src="/images/rain.png" class="weather-icon">
            <p>Clear Sky </p>
          </div>

           <!-- Temperature -->
            <div class="temperature">
                <h1 id="temperatureValue">10°C</h1>
               
            </div>

          <!-- city name -->
           <div class="city-name">
            <p>Peshawer</p>
           </div>

           <!-- weather information -->

            <div class="weather-information">

                
                <!-- wind speed -->
                <div class="wind-speed">
                    
                    <i class="fa-solid fa-wind"></i>
                    <p>2.65m/s</p>
                    <h3>wind speed</h3>
                </div>


                <!-- Humidity -->

                <div class="humidity">
                   <i class="fa-solid fa-droplet humidity-icon"></i>
                    <div class="humidity-details">
                         <p>Humidity</p>
                         <h3>65%</h3>
                            </div>
                </div>

            </div>
            <div class="modal">
                
                  
                 <p> sorry! this city is not found</p>
            </div>
     </div>
  


    <script src="script.js"></script>
</body>

</html>
